apiVersion: apps/v1
kind: Deployment
metadata:
  name: seoul-fit-backend
  labels:
    app.kubernetes.io/name: seoul-fit-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: seoul-fit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seoul-fit-backend
  template:
    metadata:
      annotations:
        observability.damecasol.com/log-schema: spring_boot_otel_json_v1
        observability.damecasol.com/service-version: PLACEHOLDER
      labels:
        app.kubernetes.io/name: seoul-fit-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: seoul-fit
        app.kubernetes.io/environment: PLACEHOLDER
    spec:
      imagePullSecrets:
        - name: seoul-fit-backend-harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.damecasol.com/seoul-fit/backend@sha256:PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: seoul-fit-backend-env
          env:
            - name: OTEL_SERVICE_NAME
              value: seoul-fit-backend
            - name: OTEL_SERVICE_NAMESPACE
              value: seoul-fit
            - name: OTEL_SERVICE_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['observability.damecasol.com/service-version']
            - name: OTEL_SERVICE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: DEPLOYMENT_ENVIRONMENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/environment']
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
            - name: OTEL_TRACES_EXPORT_ENABLED
              value: "true"
            - name: OBSERVABILITY_TRACING_SAMPLING_PROBABILITY
              value: "0.1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
