name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/wait_for_sonar_quality_gate.py"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "sonar-project.properties"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/scripts/wait_for_sonar_quality_gate.py"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "sonar-project.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-fit-backend-ci-${{ github.ref }}
  # The repository has one scale-to-zero runner. Verify only the newest
  # revision instead of spending the budget on obsolete queued commits.
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  quality:
    name: Test and coverage
    runs-on: homelab-seoul-fit-backend
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and generate the JaCoCo baseline
        # The repository's dormant 70% whole-code verification currently
        # measures about 31%. Keep that target intact, publish the real report
        # to Sonar, and let the new-code gate prevent further regression.
        run: ./gradlew test jacocoTestReport --no-daemon

  sonar:
    name: SonarQube quality gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: homelab-seoul-fit-backend
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Rebuild scanner inputs
        run: ./gradlew test jacocoTestReport --no-daemon
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          skipSignatureVerification: true
        env:
          SONAR_SCANNER_JAVA_OPTS: "-Xmx3g"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - name: Wait for and report the quality gate
        run: python3 .github/scripts/wait_for_sonar_quality_gate.py --timeout 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
