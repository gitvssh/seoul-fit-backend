name: GitOps validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gitops.yml"
      - "Dockerfile"
      - "infra/argocd/**"
      - "infra/k8s/**"
      - "infra/runtime/**"
      - "infra/scripts/validate_argocd_registration.py"
      - "infra/scripts/validate_observability_contract.py"
      - "infra/scripts/release_immutable_image.py"
      - "infra/scripts/tests/**"
      - "docs/IMMUTABLE_RELEASE.md"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gitops.yml"
      - "Dockerfile"
      - "infra/argocd/**"
      - "infra/k8s/**"
      - "infra/runtime/**"
      - "infra/scripts/validate_argocd_registration.py"
      - "infra/scripts/validate_observability_contract.py"
      - "infra/scripts/release_immutable_image.py"
      - "infra/scripts/tests/**"
      - "docs/IMMUTABLE_RELEASE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-fit-backend-gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: GitOps contract and overlays
    runs-on: homelab-seoul-fit-backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: python3 infra/scripts/validate_argocd_registration.py
      - run: python3 infra/scripts/validate_observability_contract.py
      - name: Validate the immutable release contract without credentials
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s infra/scripts/tests -p 'test_*.py'
          python3 infra/scripts/release_immutable_image.py plan \
            --source-sha "$(git rev-parse HEAD)" >/dev/null
      - run: kubectl kustomize infra/k8s/seoul-fit-backend/overlays/dev >/dev/null
      - run: kubectl kustomize infra/k8s/seoul-fit-backend/overlays/prod >/dev/null
