name: GitOps validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gitops.yml"
      - "infra/argocd/**"
      - "infra/k8s/**"
      - "infra/scripts/validate_argocd_registration.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gitops.yml"
      - "infra/argocd/**"
      - "infra/k8s/**"
      - "infra/scripts/validate_argocd_registration.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-fit-backend-gitops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: GitOps contract and overlays
    runs-on: homelab-seoul-fit-backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 1}
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - run: python3 infra/scripts/validate_argocd_registration.py
      - run: kubectl kustomize infra/k8s/seoul-fit-backend/overlays/dev >/dev/null
      - run: kubectl kustomize infra/k8s/seoul-fit-backend/overlays/prod >/dev/null
