name: Runner policy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/validate_workflow_runners.py"
      - ".github/scripts/tests/test_wait_for_sonar_quality_gate.py"
      - ".github/scripts/tests/test_validate_workflow_runners.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/validate_workflow_runners.py"
      - ".github/scripts/tests/test_wait_for_sonar_quality_gate.py"
      - ".github/scripts/tests/test_validate_workflow_runners.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seoul-fit-backend-runner-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Self-hosted runner policy
    runs-on: homelab-seoul-fit-backend
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false, fetch-depth: 1}
      - name: Reject GitHub-hosted or dynamic runner labels
        run: python3 .github/scripts/validate_workflow_runners.py homelab-seoul-fit-backend
      - name: Test the policy validator
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"
