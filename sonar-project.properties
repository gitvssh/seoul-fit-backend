sonar.projectKey=seoul-fit-backend
sonar.projectName=Seoul Fit Backend
# PREVIOUS_VERSION new-code baseline. Keep aligned with build.gradle and bump
# only for a verified release, never for every CI build.
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

sonar.exclusions=**/build/**,**/generated/**
